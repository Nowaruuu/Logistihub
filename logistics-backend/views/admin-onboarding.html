<script src="/public/frontend-api.js"></script>
<script>
var selectedPlan = {id:'',name:'',price:''};
var inviteToken = new URLSearchParams(window.location.search).get('invite') || '';

// Pre-fill email from invite token if possible
if(inviteToken) {
  OnboardingAPI.verifyInvite(inviteToken).then(function(data) {
    if(data.email) document.getElementById('f-email').value = data.email;
    if(data.company_name) {
      document.getElementById('f-company').value = data.company_name;
      document.getElementById('c-org').value = data.company_name;
      autoSlug(document.getElementById('c-org'));
    }
  }).catch(function(){});
}

function selectPlan(id,name,price){
  ['startup','enterprise','global'].forEach(function(p){
    document.getElementById('card-'+p).classList.remove('selected');
    document.getElementById('radio-'+p).classList.remove('on');
  });
  document.getElementById('card-'+id).classList.add('selected');
  document.getElementById('radio-'+id).classList.add('on');
  selectedPlan={id:id,name:name,price:price};
  var btn=document.getElementById('btn-step1-next');
  btn.disabled=false;
  btn.innerHTML='Continue with '+name+' <span class="material-symbols-outlined">arrow_forward</span>';
}

function goStep(n){
  for(var i=1;i<=4;i++){var s=document.getElementById('step'+i);if(s)s.classList.remove('active');}
  var el=document.getElementById('step'+n);
  if(el)el.classList.add('active');
  updateDots(n);
  window.scrollTo(0,0);
  if(n===2){
    document.getElementById('plan-chip').innerHTML='<span class="material-symbols-outlined">credit_card</span>'+selectedPlan.name+' — '+selectedPlan.price+'/mo';
  }
}

function updateDots(cur){
  for(var i=1;i<=3;i++){
    var dot=document.getElementById('dot-'+i);
    var lbl=document.getElementById('lbl-'+i);
    if(!dot)continue;
    var st=i<cur?'done':i===cur?'active':'idle';
    dot.className='step-dot '+st;
    lbl.className='step-lbl '+st;
    if(i<cur) dot.innerHTML='<span class="material-symbols-outlined" style="font-size:13px;">check</span>';
    else dot.textContent=i;
    var line=document.getElementById('line-'+i);
    if(line)line.className='step-line'+(i<cur?' done':'');
  }
}

function togglePw(id,btn){
  var inp=document.getElementById(id);
  var ico=btn.querySelector('.material-symbols-outlined');
  if(inp.type==='password'){inp.type='text';ico.textContent='visibility_off';}
  else{inp.type='password';ico.textContent='visibility';}
}

function showErr2(msg){
  document.getElementById('err2-msg').textContent=msg;
  document.getElementById('err2').style.display='flex';
}

function submitStep2(){
  document.getElementById('err2').style.display='none';
  var name=document.getElementById('f-name').value.trim();
  var email=document.getElementById('f-email').value.trim();
  var company=document.getElementById('f-company').value.trim();
  var pw=document.getElementById('f-pw').value;
  var pw2=document.getElementById('f-pw2').value;
  if(!name){showErr2('Please enter your full name.');return;}
  if(!email){showErr2('Please enter your work email.');return;}
  if(!company){showErr2('Please enter your company name.');return;}
  if(pw.length<8){showErr2('Password must be at least 8 characters.');return;}
  if(pw!==pw2){showErr2('Passwords do not match.');return;}
  goStep(3);
}

function autoSlug(inp){
  var slug=inp.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  document.getElementById('c-slug').value=slug;
}

async function finishSetup(){
  var btn = document.querySelector('#step3 .btn-primary');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite;">progress_activity</span> Launching...';

  var name    = document.getElementById('f-name').value.trim();
  var email   = document.getElementById('f-email').value.trim();
  var company = document.getElementById('f-company').value.trim();
  var pw      = document.getElementById('f-pw').value;
  var org     = document.getElementById('c-org').value.trim();
  var slug    = document.getElementById('c-slug').value.trim();
  var tagline = document.getElementById('c-tagline').value.trim();
  var color   = document.getElementById('c-color').value;

  if(!slug){ alert('Please enter a workspace slug.'); btn.disabled=false; btn.innerHTML='Launch My Workspace <span class="material-symbols-outlined">rocket_launch</span>'; return; }

  try {
    const data = await OnboardingAPI.createTenant({
      invite_token: inviteToken,
      plan:         selectedPlan.id,
      name,
      email,
      company_name: company,
      password:     pw,
      org_name:     org || company,
      slug,
      tagline,
      brand_color:  color,
    });

    // Show success screen
    document.getElementById('sum-name').textContent    = name;
    document.getElementById('sum-email').textContent   = email;
    document.getElementById('sum-company').textContent = org || company;
    document.getElementById('sum-plan').textContent    = selectedPlan.name + ' (' + selectedPlan.price + '/mo)';

    var base = window.location.origin;
    document.getElementById('sum-admin-url').textContent = base + '/' + slug + '/admin';
    document.getElementById('sum-reg-url').textContent   = base + '/' + slug + '/register';

    // Fix the Go to Admin Dashboard button
    document.querySelector('#step4 .btn-primary').onclick = function(){
      window.location.href = '/' + slug + '/admin';
    };

    goStep(4);

  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = 'Launch My Workspace <span class="material-symbols-outlined">rocket_launch</span>';
  }
}
</script>
<style>@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}</style>
