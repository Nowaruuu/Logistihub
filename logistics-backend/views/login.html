<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Customer Login — Logistics OS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root {
  --primary: #0f172a;
  --bg: #f8fafc;
  --accent: #10b981;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0; -webkit-font-smoothing: antialiased;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}

.card { background: #fff; padding: 40px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.04); width: 100%; max-width: 440px; text-align: center; }
.logo { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: -0.02em; }
.logo-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }

h1 { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: -0.02em; }
p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }

.form-group { text-align: left; margin-bottom: 20px; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
.field-wrap { position: relative; }
.field-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px; pointer-events: none; }
input { width: 100%; padding: 12px 14px 12px 44px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; font-weight: 500; outline: none; transition: all 0.2s; box-sizing: border-box; }
input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05); }

.btn { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 15px; margin-top: 12px; transition: all 0.2s; }
.btn:hover { background: #1e293b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

.err-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #dc2626; display: none; align-items: center; gap: 8px; margin-bottom: 20px; font-weight: 600; }
.footer-links { margin-top: 24px; font-size: 13px; color: var(--text-muted); }
.footer-links a { color: var(--primary); font-weight: 700; text-decoration: none; cursor: pointer; }
.footer-links a:hover { text-decoration: underline; }

.tenant-banner { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 12px; padding: 10px 14px; margin-bottom: 24px; text-align: left; }
.tenant-banner .material-symbols-rounded { font-size: 18px; color: var(--text-muted); }
.tenant-info { font-size: 12px; font-weight: 600; color: var(--text-muted); line-height: 1.2; }
.tenant-name-val { color: var(--primary); font-weight: 700; display: block; }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><span class="material-symbols-rounded">package_2</span></div>
    Logistics OS
  </div>

  <div class="tenant-banner">
    <span class="material-symbols-rounded">corporate_fare</span>
    <div class="tenant-info">
      Accessing portal for
      <span class="tenant-name-val" id="tenant-name">Loading workspace...</span>
    </div>
  </div>

  <h1>Welcome Back</h1>
  <p>Sign in to your customer portal to manage your shipments and orders.</p>

  <div id="err-box" class="err-box">
    <span class="material-symbols-rounded" style="font-size:18px;">error</span>
    <span id="err-msg">Invalid credentials.</span>
  </div>

  <div class="form-group">
    <label class="label">Email Address</label>
    <div class="field-wrap">
      <span class="field-ico material-symbols-rounded">mail</span>
      <input id="email" type="email" placeholder="name@company.com" autocomplete="email" required/>
    </div>
  </div>

  <div class="form-group" style="margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <label class="label" style="margin-bottom:0;">Password</label>
      <a href="#" style="font-size:12px; color:var(--text-muted); font-weight:600; text-decoration:none;">Forgot?</a>
    </div>
    <div class="field-wrap">
      <span class="field-ico material-symbols-rounded">lock</span>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
  </div>

  <button class="btn" id="login-btn" onclick="doLogin()">
    <span class="material-symbols-rounded">login</span>Sign In
  </button>

  <div class="footer-links">
    Don't have an account? <a id="reg-link">Create one</a>
  </div>
</div>

<script src="/public/frontend-api.js"></script>
<script>
const TENANT_NAME = (window.__TENANT__ && window.__TENANT__.company_name) ? window.__TENANT__.company_name : 'Workspace';
const SLUG = (window.__TENANT__ && window.__TENANT__.slug) ? window.__TENANT__.slug : '';

document.getElementById('tenant-name').textContent = TENANT_NAME;
document.getElementById('reg-link').href = `/${SLUG}/register`;

function showErr(msg) {
  const box = document.getElementById('err-box');
  document.getElementById('err-msg').textContent = msg;
  box.style.display = 'flex';
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');

  if (!email || !password) { showErr('Please enter your credentials.'); return; }

  document.getElementById('err-box').style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-rounded" style="animation:spin 1s linear infinite;">progress_activity</span> Signing in...';

  try {
    const res = await fetch(`/${SLUG}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    
    if (!res.ok) throw new Error(data.error || 'Login failed.');

    // For now, customers don't have a dedicated web dashboard, so we might redirect them to /get-app
    // Or if they are active, just show a success message or redirect to /me
    window.location.href = `/${SLUG}/get-app`;
    
  } catch (e) {
    showErr(e.message || 'Login failed. Please check your email and password.');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-rounded">login</span>Sign In';
  }
}
</script>
</body>
</html>
