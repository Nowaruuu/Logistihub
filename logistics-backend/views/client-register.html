<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration — Logistics OS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1">
  <style>
    :root { --primary: #0f2235; --bg: #f8fafc; --text: #0f172a; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    .logo { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    .qr-box { background: #f1f5f9; padding: 20px; border-radius: 16px; display: inline-block; margin-bottom: 24px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: block; }
    .footer { margin-top: 32px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="material-symbols-outlined" style="font-size:32px;">local_shipping</span>
      Logistics OS
    </div>
    <h1>Join the Network</h1>
    <p>Scan the QR code below to download the app and create your account to start shipping.</p>
    
    <div class="qr-box" id="qr-code">
      <!-- QR code will be generated here -->
    </div>

    <a href="#" class="btn">Download App Directly</a>

    <div class="footer">
      Already have an account? <a href="#" style="color:var(--primary);">Sign in on the app</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr-code"), {
      text: "https://logistihub.ddns.net/app-download",
      width: 180,
      height: 180,
      colorDark : "#0f2235",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
